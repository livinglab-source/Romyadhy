# Local development stack: Mosquitto + MariaDB
# Usage: cd deploy && docker compose up -d
#
# Services (data-logger, telegram-bot) are NOT included here —
# run them with scripts/run_services.sh so you can see the logs live.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: livinglab-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped
    # NOTE: the config above requires a password file. For local dev,
    # either create one or comment out allow_anonymous/password_file.

  mariadb:
    image: mariadb:11
    container_name: livinglab-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root_change_me
      MARIADB_DATABASE: livinglab
      MARIADB_USER: livinglab
      MARIADB_PASSWORD: change_me
    ports:
      - "3306:3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ../db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    restart: unless-stopped

volumes:
  mosquitto-data:
  mariadb-data: